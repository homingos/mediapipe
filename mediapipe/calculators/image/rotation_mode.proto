syntax = "proto2";

package mediapipe;

option java_package = "com.google.mediapipe.calculator.proto";
option java_outer_classname = "RotationModeProto";

// Counterclockwise rotation.
message RotationMode {
  enum Mode {
    UNKNOWN = 0;
    ROTATION_0 = 1;
    ROTATION_90 = 2;
    ROTATION_180 = 3;
    ROTATION_270 = 4;
  }
}
